<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>恋人空间</title>
<style>
  :root {
    --pink: #e75480;
    --pink-deep: #ff5c8a;
    --pink-soft: #ff7e9d;
    --pink-line: #ffd3de;
    --pink-bg: #fff5f7;
    --pink-band: #fdeef2;
    --pink-tint: #fffafb;
    --text: #4a2b35;
    --text-soft: #8a5a68;
    --text-mute: #b98a97;
    --text-faint: #c39aa7;
    --card-radius: 18px;
    --gap: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--pink-bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; }
  .card {
    background: #fff; border-radius: var(--card-radius); padding: 18px 16px; margin-top: var(--gap);
    box-shadow: 0 4px 18px rgba(231, 84, 128, 0.10);
  }
  .card h2 { font-size: 16px; color: var(--pink); margin-bottom: 12px; font-weight: 700; }
  .card h2 .sub { font-size: 12px; color: var(--text-mute); font-weight: 400; margin-left: 6px; }

  /* 头卡 */
  .hero {
    background: linear-gradient(135deg, #ff7e9d 0%, #ffb3c6 100%);
    border-radius: 20px; color: #fff; text-align: center;
    padding: 26px 16px 24px; margin-top: var(--gap);
    box-shadow: 0 8px 24px rgba(255, 126, 157, 0.35);
  }
  .avatars { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.28); border: 2px solid rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #fff;
  }
  .heart { font-size: 24px; animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  .names-row { display: flex; justify-content: center; gap: 74px; margin-top: 8px; font-size: 13px; opacity: 0.95; }
  .hero .big { margin-top: 18px; font-size: 17px; }
  .hero .big b { font-size: 40px; font-weight: 800; vertical-align: -6px; margin: 0 4px; }
  .hero .small { margin-top: 6px; font-size: 12.5px; opacity: 0.9; }

  .meeting-card { text-align: center; }
  .meeting-card .days { font-size: 30px; font-weight: 800; color: #e75480; }
  .meeting-card .label { font-size: 14px; color: #8a5a68; margin-top: 2px; }

  /* 纪念日列表 */
  .mile { display: flex; align-items: center; justify-content: space-between; padding: 11px 2px; border-bottom: 1px solid #fdeef2; }
  .mile:last-child { border-bottom: none; }
  .mile .t { font-size: 15px; font-weight: 600; }
  .mile .d { font-size: 12px; color: #b98a97; margin-top: 2px; }
  .mile .r { text-align: right; font-size: 13px; color: #8a5a68; white-space: nowrap; }
  .mile .r b { font-size: 21px; color: #ff5c8a; font-weight: 800; margin: 0 2px; }

  /* 表单与按钮 */
  input[type="text"], input[type="password"], input[type="date"], textarea, select {
    width: 100%; border: 1.5px solid #ffd3de; border-radius: 12px; padding: 11px 12px;
    font-size: 16px; background: #fffafb; color: var(--text); outline: none; font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: #ff7e9d; }
  textarea { resize: vertical; min-height: 64px; }
  .btn {
    display: inline-block; border: none; cursor: pointer; border-radius: 999px;
    background: linear-gradient(135deg, #ff7e9d, #ff5c8a); color: #fff;
    font-size: 15px; font-weight: 600; padding: 11px 22px; font-family: inherit;
    min-height: 42px;
    box-shadow: 0 4px 12px rgba(255, 92, 138, 0.35);
  }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: #fff; color: #e75480; border: 1.5px solid #ffb3c6; box-shadow: none; }
  .btn.small { padding: 8px 14px; font-size: 13px; min-height: 40px; }
  .btn.block { width: 100%; margin-top: 12px; }
  .row { display: flex; gap: 8px; }
  .row > *:first-child { flex: 1; }
  .mt { margin-top: 10px; }
  .err { color: #d6336c; font-size: 13px; min-height: 18px; margin-top: 8px; text-align: center; }

  /* 每日一问 / 留言 / 愿望 / 信件 */
  .q-text { font-size: 16.5px; font-weight: 600; line-height: 1.55; }
  .ans { background: #fff5f7; border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .ans .who { font-size: 12px; color: #e75480; font-weight: 700; margin-bottom: 4px; }
  .ans .txt { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .ans .none { font-size: 14px; color: #c39aa7; }
  .msg { padding: 10px 2px; border-bottom: 1px solid #fdeef2; }
  .msg:last-child { border-bottom: none; }
  .msg .meta { font-size: 12px; color: #b98a97; margin-bottom: 3px; }
  .msg .meta b { color: #e75480; }
  .msg .txt { font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .wish { display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px; border-bottom: 1px solid #fdeef2; }
  .wish:last-child { border-bottom: none; }
  .wish .toggle { font-size: 20px; line-height: 1.2; cursor: pointer; background: none; border: none; padding: 0; }
  .wish .txt { flex: 1; font-size: 15px; line-height: 1.55; word-break: break-word; }
  .wish .txt.done { text-decoration: line-through; color: #c39aa7; }
  .wish .by { font-size: 11.5px; color: #b98a97; margin-top: 2px; }
  .wish .del { background: none; border: none; color: #d8a1b1; font-size: 16px; cursor: pointer; padding: 0 2px; }
  .letter { background: #fff5f7; border-radius: 12px; padding: 12px; margin-top: 10px; }
  .letter .lt { font-size: 15px; font-weight: 700; }
  .letter .lm { font-size: 12px; color: #b98a97; margin: 3px 0 6px; }
  .letter .lb { font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .letter .locked { font-size: 14px; color: #b98a97; }

  .miss-wrap { text-align: center; }
  .miss-btn {
    width: 118px; height: 118px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ff7e9d, #ff5c8a); color: #fff;
    font-size: 19px; font-weight: 700; font-family: inherit;
    box-shadow: 0 8px 22px rgba(255, 92, 138, 0.4);
  }
  .miss-btn:active { transform: scale(0.95); }
  .miss-counts { margin-top: 14px; font-size: 14px; color: #8a5a68; line-height: 1.7; }
  .miss-counts b { color: #e75480; }

  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
  .placeholder { text-align: center; color: #c39aa7; font-size: 14px; padding: 14px 0; }
  .empty { text-align: center; color: #c39aa7; font-size: 14px; padding: 10px 0; }

  /* 登录 / 身份 */
  .gate { max-width: 420px; margin: 9vh auto 0; }
  .gate .card { text-align: center; padding: 30px 22px; }
  .gate .logo { font-size: 44px; }
  .gate h1 { font-size: 21px; color: #e75480; margin: 10px 0 6px; letter-spacing: 2px; }
  .gate p { font-size: 13.5px; color: #b98a97; margin-bottom: 16px; }
  .who-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }

  .hidden { display: none !important; }
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: rgba(74, 43, 53, 0.92); color: #fff; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: all 0.25s ease; max-width: 86vw; text-align: center; z-index: 99;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 顶部导航（可展开） */
  html { scroll-behavior: smooth; }
  .card { scroll-margin-top: 74px; }
  .hero { scroll-margin-top: 74px; }
  .topnav {
    position: sticky; top: 8px; z-index: 60;
    background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 16px; box-shadow: 0 4px 18px rgba(231, 84, 128, 0.13);
    padding: 10px 14px; margin-top: 4px;
  }
  .topnav-bar { display: flex; align-items: center; justify-content: space-between; }
  .topnav-brand { font-size: 17px; font-weight: 700; color: #e75480; letter-spacing: 2px; }
  .topnav-brand .heart { font-size: 15px; margin-left: 2px; }
  .nav-toggle {
    width: 40px; height: 40px; border: none; border-radius: 12px; cursor: pointer;
    background: #fff0f4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  }
  .nav-toggle span { display: block; width: 18px; height: 2px; border-radius: 2px; background: #e75480; transition: transform 0.25s ease, opacity 0.2s ease; }
  .nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .nav-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .nav-panel.open { max-height: 420px; }
  .nav-links { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
  .nav-links a {
    flex: 1 1 30%; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    text-decoration: none;
    font-size: 14px; font-weight: 600; color: #c2436f;
    background: var(--pink-bg); border: 1.5px solid var(--pink-line); border-radius: 999px;
    padding: 9px 6px; min-height: 40px; line-height: 1;
  }
  .nav-links a:active { background: #ffe3ec; }
  .nav-ico { font-size: 13px; line-height: 1; }

  /* 未读提醒横幅 */
  .unread-banner {
    display: flex; align-items: center; gap: 10px; margin-top: var(--gap);
    background: #ffe3ec; color: #b8365f;
    border: 1px solid #ffc2d3; border-radius: 16px;
    padding: 12px 10px 12px 14px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(231, 84, 128, 0.14);
    font-size: 14px; line-height: 1.45; font-weight: 600;
  }
  .unread-banner .unread-text { flex: 1; }
  .unread-close {
    flex: none; width: 40px; height: 40px; border: none; border-radius: 999px;
    background: rgba(231, 84, 128, 0.14); color: #b8365f; font-size: 13px;
    cursor: pointer; font-family: inherit; line-height: 1;
  }

  /* 今日状态卡 */
  .status-card h2 { margin-bottom: 10px; }
  .status-other { background: var(--pink-bg); border-radius: 14px; padding: 14px 14px 12px; }
  .status-other .one { font-size: 20px; font-weight: 700; line-height: 1.35; }
  .status-other .one .emoji { font-size: 24px; margin-right: 4px; vertical-align: -2px; }
  .status-other .one .word { font-weight: 700; }
  .status-other .note { font-size: 14px; margin-top: 4px; color: var(--text); }
  .status-other .when { font-size: 12px; color: var(--text-mute); margin-top: 5px; }
  .status-other .empty-line { font-size: 14px; color: var(--text-faint); }
  .status-mine-label { font-size: 12.5px; color: var(--text-soft); font-weight: 600; margin: 14px 0 8px; }
  .mood-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .mood-pill {
    border: 1.5px solid var(--pink-line); background: #fff; color: var(--text-soft);
    border-radius: 999px; padding: 0 12px; min-height: 40px; font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .mood-pill.on {
    background: linear-gradient(135deg, var(--pink-soft), var(--pink-deep));
    border-color: transparent; color: #fff;
  }
  .free-busy {
    width: 100%; margin-top: 10px; min-height: 44px; font-size: 15px !important;
    background: #fff0f4 !important; color: var(--pink) !important; border: 1.5px solid #ffd3de !important;
    box-shadow: none !important; border-radius: 999px;
  }
  .status-mini { font-size: 12px; color: var(--text-mute); margin-top: 8px; text-align: center; }

  /* 回应行 */
  .react-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .react-chip {
    border: 1.5px solid var(--pink-line); background: #fff; color: var(--text-soft);
    border-radius: 999px; padding: 0 10px; min-height: 36px; font-family: inherit;
    font-size: 12.5px; font-weight: 600; cursor: pointer; line-height: 1.1;
  }
  .react-chip.on { background: #ffe3ec; border-color: var(--pink-soft); color: var(--pink); font-weight: 700; }
  .react-them { font-size: 12.5px; color: var(--text-mute); margin-left: 2px; }
  .seen-tip { font-size: 11.5px; color: #d6b2bd; margin-top: 5px; }
  .react-line.light { margin-top: 5px; gap: 5px; }
  .react-line.light .react-chip { min-height: 32px; font-size: 12px; padding: 0 9px; }

  /* 月月小记 */
  .period-sub { font-size: 12.5px; color: var(--text-soft); margin-top: 4px; line-height: 1.6; }
  .period-list { margin-top: 8px; }
  .period-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 0; border-bottom: 1px solid var(--pink-band);
  }
  .period-row:last-child { border-bottom: none; }
  .period-row .pmain { flex: 1; min-width: 0; }
  .period-row .pd1 { font-size: 14px; font-weight: 600; }
  .period-row .pd2 { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
  .period-row .pnote { font-size: 13px; color: var(--text-soft); margin-top: 2px; word-break: break-word; }
  .period-row .pdel {
    background: none; border: none; color: #d8a1b1; font-size: 15px;
    cursor: pointer; padding: 2px 4px; font-family: inherit; min-height: 40px; min-width: 32px;
  }
  .period-hint { font-size: 11.5px; color: #cfb0ba; margin-top: 12px; line-height: 1.6; }
  .period-big { font-size: 17px; font-weight: 700; line-height: 1.5; }
  .period-big.period-active { color: #e75480; }
  .period-big.period-soon { color: #d9822b; }
  #periodTodayBtn { min-width: 132px; }
  .period-done-form .btn { min-height: 40px; padding: 0 12px; font-size: 12.5px; white-space: nowrap; }
  .period-done-form { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .period-form { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--pink-band); }
  .period-fields { display: flex; gap: 8px; margin-top: 12px; }
  .period-field { flex: 1; min-width: 0; font-size: 12px; color: var(--text-soft); font-weight: 600; }
  .period-field input { margin-top: 4px; }
  .period-done-form input[type="date"] { padding: 7px 9px; font-size: 16px; }

  /* 空状态统一 */
  .empty { text-align: center; color: var(--text-faint); font-size: 14px; padding: 12px 4px; line-height: 1.6; }

  .settings label { display: block; font-size: 13px; color: #8a5a68; margin: 14px 0 6px; font-weight: 600; }
  .settings label:first-of-type { margin-top: 0; }
  .foot-btns { display: flex; gap: 10px; margin-top: 16px; }
  .foot-btns .btn { flex: 1; }
  /* 窄屏细节 */
  @media (max-width: 380px) {
    .status-other .one { font-size: 18px; }
    .period-fields { flex-direction: column; }
    .react-line { gap: 5px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginView" class="wrap gate hidden">
  <div class="card">
    <div class="logo">💌</div>
    <h1>恋人空间</h1>
    <p>这是只属于两个人的小站，请输入口令</p>
    <input type="password" id="gateInput" placeholder="输入口令" autocomplete="current-password">
    <button class="btn block" id="loginBtn">进 入</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 身份选择 -->
<div id="whoView" class="wrap gate hidden">
  <div class="card">
    <div class="logo">💑</div>
    <h1>你是谁呀？</h1>
    <p>选一次就好，以后留言、答题都会带着这个身份</p>
    <div class="who-btns" id="whoBtns"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainView" class="wrap hidden">
  <nav class="topnav" id="topnav">
    <div class="topnav-bar">
      <div class="topnav-brand">恋人空间<span class="heart">❤️</span></div>
      <button class="nav-toggle" id="navToggle" aria-label="展开导航" aria-expanded="false" aria-controls="navPanel">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-panel" id="navPanel">
      <div class="nav-links">
        <a href="#sec-home"><span class="nav-ico" aria-hidden="true">💞</span><span>在一起</span></a>
        <a href="#sec-milestones"><span class="nav-ico" aria-hidden="true">🎂</span><span>纪念日</span></a>
        <a href="#sec-question"><span class="nav-ico" aria-hidden="true">💬</span><span>每日一问</span></a>
        <a href="#sec-miss"><span class="nav-ico" aria-hidden="true">❤️</span><span>想你了</span></a>
        <a href="#sec-messages"><span class="nav-ico" aria-hidden="true">✉️</span><span>留言墙</span></a>
        <a href="#sec-wishes"><span class="nav-ico" aria-hidden="true">🌟</span><span>愿望清单</span></a>
        <a href="#sec-letters"><span class="nav-ico" aria-hidden="true">⏳</span><span>时光信</span></a>
        <a href="#sec-photos"><span class="nav-ico" aria-hidden="true">📷</span><span>照片墙</span></a>
        <a href="#sec-settings"><span class="nav-ico" aria-hidden="true">⚙️</span><span>设置</span></a>
        <a href="#sec-period"><span class="nav-ico" aria-hidden="true">🌙</span><span>月月小记</span></a>
      </div>
    </div>
  </nav>

  <div class="hero" id="sec-home">
    <div class="avatars">
      <div class="avatar" id="avatarA">?</div>
      <div class="heart">❤️</div>
      <div class="avatar" id="avatarB">?</div>
    </div>
    <div class="names-row"><span id="nameA"></span><span id="nameB"></span></div>
    <div class="big">我们在一起已经 <b id="daysTogether">–</b> 天</div>
    <div class="small" id="startText"></div>
  </div>

  <div class="unread-banner hidden" id="unreadBanner" role="status" aria-live="polite">
    <span class="unread-text" id="unreadText"></span>
    <button class="unread-close" id="unreadClose" aria-label="关闭提醒" title="关闭">✕</button>
  </div>

  <div class="card status-card" id="sec-status">
    <h2>今日状态 <span class="sub">现在在忙什么</span></h2>
    <div class="status-other" id="statusOther"></div>
    <div class="status-mine-label">我的状态</div>
    <div class="mood-row" id="moodRow"></div>
    <input type="text" id="statusText" class="mt" maxlength="50" placeholder="附一句话，可不填（最多 50 字）">
    <button class="btn block" id="statusSaveBtn">更新我的状态</button>
    <button class="btn free-busy" id="busyDoneBtn">忙完啦</button>
    <div class="status-mini" id="statusMini"></div>
  </div>

  <div class="card meeting-card">
    <div id="meetingBody"></div>
  </div>

  <div class="card" id="sec-milestones">
    <h2>纪念日</h2>
    <div id="milestoneList"></div>
  </div>

  <div class="card" id="sec-question">
    <h2>每日一问 <span class="sub">同一天，同一个问题</span></h2>
    <div class="q-text" id="questionText">加载中…</div>
    <div id="answersBox"></div>
    <textarea id="myAnswer" class="mt" maxlength="500" placeholder="写下我的答案…"></textarea>
    <button class="btn block" id="answerBtn">提交我的答案</button>
  </div>

  <div class="card miss-wrap" id="sec-miss">
    <h2 style="text-align:left;">想你了</h2>
    <button class="miss-btn" id="missBtn">想你了<br>❤</button>
    <div class="miss-counts" id="missCounts"></div>
  </div>

  <div class="card" id="sec-messages">
    <h2>留言墙</h2>
    <div id="msgList"></div>
    <div class="row mt">
      <input type="text" id="msgInput" maxlength="500" placeholder="想对 TA 说的话…">
      <button class="btn" id="msgBtn">留言</button>
    </div>
  </div>

  <div class="card" id="sec-wishes">
    <h2>愿望清单 <span class="sub">想一起做的事</span></h2>
    <div id="wishList"></div>
    <div class="row mt">
      <input type="text" id="wishInput" maxlength="500" placeholder="加一个愿望…">
      <button class="btn" id="wishBtn">添加</button>
    </div>
  </div>

  <div class="card" id="sec-letters">
    <h2>时光信 <span class="sub">写给未来的我们</span></h2>

<div id="toast"></div>

<script>
"use strict";
// ============ 部署时把这里改成 Worker 的地址（如 love-api.xxx.workers.dev） ============
const API_BASE = "https://love-site-vercel.vercel.app";

// ============ 工具 ============
const $ = (id) => document.getElementById(id);
// 统一用 textContent/createElement 渲染用户内容，杜绝 XSS；
// 全页不出现任何把用户数据拼进 innerHTML / insertAdjacentHTML / document.write 的路径
// （innerHTML 仅用于清空容器为 ""）
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function fmtDateCN(s) {
  if (!s) return "";
  const [y, m, d] = s.split("-");
  return `${y}年${Number(m)}月${Number(d)}日`;
}
function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch { return ""; }
}
// 相对时间：刚刚 / N 分钟前 / N 小时前 / 昨天 / N 天前 / 日期
function relTime(iso) {
  const t = Date.parse(iso);
  if (!t || Number.isNaN(t)) return "";
  const diff = Date.now() - t;
  if (diff < 0) return "刚刚";
  const min = Math.floor(diff / 60000);
  if (min < 1) return "刚刚";
  if (min < 60) return min + " 分钟前";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + " 小时前";
  const day = Math.floor(hr / 24);
  if (day === 1) return "昨天";
  if (day < 7) return day + " 天前";
  // 更久以前显示日期（按上海时区，避免跨日误差）
  const dstr = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
  }).format(new Date(t));
  return fmtDateCN(dstr);
}
// 按上海时区的今天（YYYY-MM-DD）；不写死任何日期
function todayStr() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
  }).format(new Date());
}
// 今天 00:00（上海）对应的毫秒时间戳
function todayStartMs() {
  return Date.parse(todayStr() + "T00:00:00+08:00");
}
const MOODS = {
  busy: { emoji: "🧑‍💻", word: "忙着呢" },
  free: { emoji: "☕️", word: "有空啦" },
  tired: { emoji: "😮‍💨", word: "有点累" },
  happy: { emoji: "😄", word: "很开心" },
  sleep: { emoji: "😴", word: "睡觉啦" },
  miss: { emoji: "🥺", word: "想你了" },
};
const REACTIONS = {
  hug: { emoji: "🤗", word: "抱抱" },
  love: { emoji: "❤️", word: "爱了" },
  laugh: { emoji: "😄", word: "哈哈" },
  care: { emoji: "🫂", word: "心疼" },
};

// ============ 状态 ============
let token = localStorage.getItem("love_token") || "";
let who = localStorage.getItem("love_who") || "";
let cfg = null;
let computed = null;
let reactions = {};
let seen = { a: null, b: null };
// 未读横幅只在本页显示一次，关闭或点击后不再重复
let bannerShown = false;
function myName() { return who === "a" ? cfg.names.a : cfg.names.b; }
function otherWho() { return who === "a" ? "b" : "a"; }
function nameOf(w) { return w === "a" ? cfg.names.a : cfg.names.b; }

// ============ API 封装 ============
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        ...(token ? { "X-Auth": token } : {}),
        ...(opts.headers || {}),
      },
    });
  } catch (e) {
    throw new Error("网络不太顺，请稍后再试");
  }
  let data = {};
  try { data = await res.json(); } catch { /* 忽略 */ }
  if (res.status === 401) {
    doLogout();
    throw new Error(data.error || "登录已过期，请重新输入口令");
  }
  if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
  return data;
}
function apiPost(path, body) {
  return api(path, { method: "POST", body: JSON.stringify(body) });
}

// ============ 视图切换 ============
function show(viewId) {
  for (const id of ["loginView", "whoView", "mainView"]) {
    $(id).classList.toggle("hidden", id !== viewId);
  }
}
function doLogout() {
  token = ""; who = "";
  seenReported = false;
  localStorage.removeItem("love_token");
  localStorage.removeItem("love_who");
  show("loginView");
}

// ============ 登录与身份 ============
async function doLogin() {
  const code = $("gateInput").value;
  const err = $("loginErr");
  err.textContent = "";
  if (!code) { err.textContent = "先输入口令哦"; return; }
  try {
    const data = await apiPost("/api/login", { code });
    token = data.token;
    localStorage.setItem("love_token", token);
    $("gateInput").value = "";
    await loadAll();
  } catch (e) {
    err.textContent = e.message;
  }
}
function renderWhoChoices() {
  const box = $("whoBtns");
  box.innerHTML = "";
  for (const w of ["a", "b"]) {
    const b = el("button", "btn block", "我是 " + cfg.names[w]);
    b.style.marginTop = "0";
    b.addEventListener("click", () => {
      who = w;
      localStorage.setItem("love_who", who);
      seenReported = false;
      bannerShown = false;
      $("unreadBanner").classList.add("hidden");
      enterMain();
    });
    box.appendChild(b);
  }
}

// ============ 数据加载与渲染 ============
async function loadAll() {
  const data = await api("/api/config");
  cfg = data.cfg;
  computed = data.computed;
  if (!who) {
    renderWhoChoices();
    show("whoView");
    return;
  }
  enterMain();
}
async function refreshConfig() {
  const data = await api("/api/config");
  cfg = data.cfg;
  computed = data.computed;
  renderHero();
  renderMeeting();
  renderMilestones();
  renderPhotos();
}
async function enterMain() {
  show("mainView");
  renderHero();
  renderMeeting();
  renderMilestones();
  renderPhotos();
  $("setMeeting").value = cfg.meetingDate || "";
  bindUnreadBanner();
  await Promise.all([loadSeen(), loadReactions()]);
  reportSeen();
  loadQuestion();
  loadMessages();
  loadMiss();
  loadWishes();
  loadLetters();
  initStatusCard();
  loadPeriod();
}
function renderHero() {
  $("avatarA").textContent = [...cfg.names.a][0] || "?";
  $("avatarB").textContent = [...cfg.names.b][0] || "?";
  $("nameA").textContent = cfg.names.a;
  $("nameB").textContent = cfg.names.b;
  $("daysTogether").textContent = computed.daysTogether;
  $("startText").textContent = "起始日期 " + fmtDateCN(cfg.startDate);
}
function renderMeeting() {
  const box = $("meetingBody");
  box.innerHTML = "";
  if (!computed.meeting) {
    box.appendChild(el("div", "label", "下次见面日期待设置"));
    box.appendChild(el("div", "label", "在下面设置区选个日子，开始期待吧"));
    return;
  }
  const { date, daysLeft } = computed.meeting;
  if (daysLeft > 0) {
    const d = el("div", "days", String(daysLeft));
    box.appendChild(el("div", "label", "距离下次见面还有"));
    box.appendChild(d);
    box.appendChild(el("div", "label", "天 · " + fmtDateCN(date)));
  } else if (daysLeft === 0) {
    box.appendChild(el("div", "days", "就是今天"));
    box.appendChild(el("div", "label", "见面日 " + fmtDateCN(date) + "，好好珍惜今天"));
  } else {
    box.appendChild(el("div", "label", "上次见面是 " + fmtDateCN(date)));
    box.appendChild(el("div", "label", "去设置区定下一次见面吧"));
  }
}
function renderMilestones() {
  const box = $("milestoneList");
  box.innerHTML = "";
  if (!computed.milestones.length) {
    box.appendChild(el("div", "empty", "还没有纪念日，去设置区添加吧"));
    return;
  }
  for (const m of computed.milestones) {
    const row = el("div", "mile");
    const left = el("div");
    left.appendChild(el("div", "t", m.title));
    let dtext = m.dateText;
    if (m.mode === "countdown" && m.nextDate) dtext += " · 下次 " + fmtDateCN(m.nextDate);
    left.appendChild(el("div", "d", dtext));
    const right = el("div", "r");
    if (m.mode === "elapsed") {
      right.appendChild(document.createTextNode("已经 "));
      right.appendChild(el("b", null, String(m.days)));
      right.appendChild(document.createTextNode(" 天"));
    } else if (m.days === 0) {
      right.appendChild(el("b", null, "就是今天"));
    } else {
      right.appendChild(document.createTextNode("还有 "));
      right.appendChild(el("b", null, String(m.days)));
      right.appendChild(document.createTextNode(" 天"));
    }
    row.appendChild(left);
    row.appendChild(right);
    box.appendChild(row);
  }
}
function renderPhotos() {
  const box = $("photoWall");
  box.innerHTML = "";
  // 渲染前再次校验协议：仅 http/https，且拒绝含控制字符的 URL（防 javascript: 等注入与解析歧义）
  const urls = (cfg.photos || []).filter(
    (u) => typeof u === "string" && /^https?:\/\/[^\x00-\x1f\x7f]+$/i.test(u),
  );
  if (!urls.length) {
    box.appendChild(el("div", "placeholder", "还没有照片，在设置区贴一张图片链接，这里就会变成你们的照片墙"));
    return;
  }
  const grid = el("div", "photos");
  for (const u of urls) {
    const img = document.createElement("img");
    img.src = u;
    img.alt = "照片";
    img.loading = "lazy";
    grid.appendChild(img);
  }
  box.appendChild(grid);
}

// ============ 回应（reactions）与已读提示 ============
// 回应行挂在渲染出的节点上；接口返回最新 reactions 后统一重绘仍存活的节点
const reactionLines = [];
function reactLine(target, light) {
  const line = el("div", "react-line" + (light ? " light" : ""));
  line.dataset.target = target;
  reactionLines.push({ node: line, target });
  paintReactLine(line, target);
  return line;
}
function paintReactLine(line, target) {
  line.innerHTML = "";
  const r = reactions[target] || {};
  const mine = r[who] || null;
  const theirs = r[otherWho()] || null;
  for (const [type, info] of Object.entries(REACTIONS)) {
    const b = el("button", "react-chip" + (mine === type ? " on" : ""), info.emoji + " " + info.word);
    b.type = "button";
    b.setAttribute("aria-pressed", String(mine === type));
    b.title = mine === type ? "再点一次取消" : info.word;
    b.addEventListener("click", () => sendReaction(target, type));
    line.appendChild(b);
  }
  if (theirs) line.appendChild(el("span", "react-them", "TA " + REACTIONS[theirs].emoji + REACTIONS[theirs].word));
}
function refreshReactLines() {
  for (let i = reactionLines.length - 1; i >= 0; i--) {
    const it = reactionLines[i];
    if (it.node.isConnected) paintReactLine(it.node, it.target);
    else reactionLines.splice(i, 1);
  }
}
async function loadReactions() {
  try {
    const d = await api("/api/reactions");
    reactions = d.reactions || {};
    refreshReactLines();
  } catch (e) { toast(e.message); }
}
async function sendReaction(target, type) {
  if (!who) return;
  try {
    const d = await apiPost("/api/react", { who, target, type });
    reactions = d.reactions || {};
    refreshReactLines();
  } catch (e) { toast(e.message); }
}
let seenReported = false;
let seenTimer = null;
async function loadSeen() {
  try {
    const d = await api("/api/seen");
    seen = d.seen || { a: null, b: null };
  } catch (e) { seen = { a: null, b: null }; }
}
// 每次进入页面最多报一次；页面加载与留言渲染都触发时用 400ms 防抖合并
function reportSeen() {
  if (!who || seenReported) return;
  seenReported = true;
  clearTimeout(seenTimer);
  seenTimer = setTimeout(async () => {
    try {
      const d = await apiPost("/api/seen", { who });
      seen = d.seen || seen;
      loadMessages();
    } catch (e) { /* 已读上报失败不打扰 */ }
  }, 400);
}
function partnerHasSeen(ts) {
  const t = Date.parse(seen[otherWho()]);
  const m = Date.parse(ts);
  return Number.isFinite(t) && Number.isFinite(m) && t >= m;
}

// ============ 今日状态卡 ============
let statusData = { a: null, b: null };
let chosenMood = null;
function renderStatusCard() {
  const partner = otherWho();
  const other = statusData[partner];
  const box = $("statusOther");
  box.innerHTML = "";
  if (other && MOODS[other.mood]) {
    const one = el("div", "one");
    one.appendChild(el("span", "emoji", MOODS[other.mood].emoji));
    one.appendChild(el("span", "word", MOODS[other.mood].word));
    box.appendChild(one);
    if (other.text) box.appendChild(el("div", "note", other.text));
    if (other.ts) box.appendChild(el("div", "when", relTime(other.ts) + "更新"));
  } else {
    box.appendChild(el("div", "empty-line", nameOf(partner) + " 还没更新今日状态"));
  }
  paintMoodPills();
  const mine = statusData[who];
  const mini = $("statusMini");
  mini.textContent = chosenMood && MOODS[chosenMood]
    ? "已选：" + MOODS[chosenMood].emoji + " " + MOODS[chosenMood].word
    : mine && MOODS[mine.mood] && mine.ts
      ? "我的状态：" + MOODS[mine.mood].emoji + " " + MOODS[mine.mood].word + " · " + relTime(mine.ts)
      : "";
}
function paintMoodPills() {
  const row = $("moodRow");
  row.innerHTML = "";
  for (const [mood, info] of Object.entries(MOODS)) {
    const b = el("button", "mood-pill" + (chosenMood === mood ? " on" : ""), info.emoji + " " + info.word);
    b.type = "button";
    b.setAttribute("aria-pressed", String(chosenMood === mood));
    b.addEventListener("click", () => {
      chosenMood = chosenMood === mood ? null : mood;
      renderStatusCard();
    });
    row.appendChild(b);
  }
}
let statusBound = false;
async function initStatusCard() {
  try {
    const d = await api("/api/status");
    statusData = d.status || { a: null, b: null };
  } catch (e) { statusData = { a: null, b: null }; }
  const mine = statusData[who];
  chosenMood = mine && MOODS[mine.mood] ? mine.mood : null;
  $("statusText").value = mine && mine.text ? mine.text : "";
  if (!statusBound) {
    statusBound = true;
    $("statusSaveBtn").addEventListener("click", submitStatus);
    $("busyDoneBtn").addEventListener("click", submitBusyDone);
  }
  renderStatusCard();
}
async function submitStatus() {
  if (!chosenMood || !MOODS[chosenMood]) { toast("先选一个现在的状态吧"); return; }
  const text = $("statusText").value.trim();
  try {
    const d = await apiPost("/api/status", { who, mood: chosenMood, text: text || undefined });
    statusData = d.status || statusData;
    $("statusText").value = (statusData[who] && statusData[who].text) || "";
    renderStatusCard();
    toast("状态已更新");
  } catch (e) { toast(e.message); }
}
async function submitBusyDone() {
  try {
    const d = await apiPost("/api/status", { who, mood: "free", text: "忙完啦，来陪你了" });
    statusData = d.status || statusData;
    chosenMood = "free";
    $("statusText").value = "忙完啦，来陪你了";
    renderStatusCard();
    toast("告诉 TA 你有空啦");
  } catch (e) { toast(e.message); }
}

// ============ 未读提醒（纯前端 localStorage） ============
let lastMessages = [];
let lastMiss = null;
let lastQuestion = null;
function lastVisitKey() { return "love_last_visit_" + who; }
function readLastVisit() {
  let raw = null;
  try { raw = localStorage.getItem(lastVisitKey()); } catch { /* 隐私模式读不了 */ }
  const fallback = Date.now() - 24 * 3600 * 1000;
  if (raw === null) {
    try { localStorage.setItem(lastVisitKey(), String(fallback)); } catch { /* 忽略 */ }
    return fallback;
  }
  const n = Number(raw);
  if (Number.isFinite(n) && n > 0 && n <= Date.now()) return n;
  try { localStorage.setItem(lastVisitKey(), String(fallback)); } catch { /* 忽略 */ }
  return fallback;
}
function updateUnread() {
  if (!who || bannerShown) return;
  if (!lastMessages || !lastMiss || !lastQuestion) return;
  const banner = $("unreadBanner");
  const text = $("unreadText");
  const lv = readLastVisit();
  const todayStart = todayStartMs();
  const partner = otherWho();
  const parts = [];
  const newMsgs = lastMessages.filter((m) => m.who === partner && Date.parse(m.ts) > lv).length;
  if (newMsgs > 0) parts.push("💌 " + nameOf(partner) + " 留了 " + newMsgs + " 条新留言");
  const missN = lv < todayStart && lastMiss.today ? (lastMiss.today[partner] || 0) : 0;
  if (missN > 0) parts.push("今天想了你 " + missN + " 次");
  const answered = !!(lastQuestion && lastQuestion.answers && lastQuestion.answers[partner]);
  if (answered && lv < todayStart) parts.push("已回答今日一问");
  if (!parts.length) return;
  text.textContent = parts.join(" · ");
  banner.classList.remove("hidden");
  bannerShown = true;
  saveLastVisit();
}
let unreadBound = false;
function bindUnreadBanner() {
  if (unreadBound) return;
  unreadBound = true;
  $("unreadClose").addEventListener("click", (e) => {
    e.stopPropagation();
    $("unreadBanner").classList.add("hidden");
    saveLastVisit();
  });
  $("unreadBanner").addEventListener("click", () => {
    $("unreadBanner").classList.add("hidden");
    saveLastVisit();
    const target = $("sec-messages");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}
function saveLastVisit() {
  try { localStorage.setItem(lastVisitKey(), String(Date.now())); } catch { /* 忽略 */ }
}

// ============ 每日一问 ============
async function loadQuestion() {
  try {
    const data = await api("/api/question");
    const today = data.date || todayStr();
    lastQuestion = data;
    $("questionText").textContent = data.question;
    const box = $("answersBox");
    box.innerHTML = "";
    for (const w of ["a", "b"]) {
      const card = el("div", "ans");
      card.appendChild(el("div", "who", nameOf(w) + (w === who ? "（我）" : "")));
      if (data.answers[w]) card.appendChild(el("div", "txt", data.answers[w]));
      else card.appendChild(el("div", "none", "还没写"));

// ============ 月月小记（生理期） ============
// 只经鉴权接口读写；前端不保存、不写死任何真实日期
let periodRecords = [];
let periodComputed = {};
function fmtMD(s) {
  if (!s) return "";
  const p = s.split("-");
  return Number(p[1]) + " 月 " + Number(p[2]) + " 日";
}
function daysBetweenStrs(from, to) {
  const a = Date.parse(from + "T00:00:00Z");
  const b = Date.parse(to + "T00:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
  return Math.round((b - a) / 86400000);
}
function periodCycleText(c) {
  if (!c || c.avgCycle == null) {
    return c && c.avgDuration != null
      ? "平均 " + c.avgDuration + " 天 · 多记两次，预测会更准"
      : "多记两次，预测会更准";
  }
  let t = "平均周期 " + c.avgCycle + " 天";
  if (c.avgDuration != null) t += " · 平均 " + c.avgDuration + " 天";
  return t;
}
function renderPeriodHead() {
  const big = $("periodBig");
  const sub = $("periodSub");
  const c = periodComputed || {};
  big.classList.remove("period-active", "period-soon");
  if (c.currentDay) {
    big.textContent = "经期第 " + c.currentDay + " 天";
    big.classList.add("period-active");
  } else if (!c.nextPredicted) {
    big.textContent = "还没有记录";
  } else if (c.daysUntilNext === 0) {
    big.textContent = "预计今天来";
    big.classList.add("period-soon");
  } else if (c.daysUntilNext > 0) {
    big.textContent = "预计下次：" + fmtMD(c.nextPredicted) + " · 还有 " + c.daysUntilNext + " 天";
  } else {
    big.textContent = "预计下次：" + fmtMD(c.nextPredicted) + " · 已推迟 " + Math.abs(c.daysUntilNext) + " 天";
    big.classList.add("period-soon");
  }
  sub.textContent = periodCycleText(c) + (c.lastStart ? " · 上次 " + fmtMD(c.lastStart) : "");
}
function periodRow(r) {
  const row = el("div", "period-row");
  const main = el("div", "pmain");
  const dur = r.end ? daysBetweenStrs(r.start, r.end) : null;
  let d1 = fmtMD(r.start) + " 开始";
  if (r.end) d1 += " · " + fmtMD(r.end) + " 结束";
  main.appendChild(el("div", "pd1", d1));
  if (dur !== null) main.appendChild(el("div", "pd2", "共 " + (dur + 1) + " 天"));
  if (r.note) main.appendChild(el("div", "pnote", r.note));
  if (!r.end) {
    const form = el("div", "period-done-form");
    const inp = document.createElement("input");
    inp.type = "date";
    inp.min = r.start;
    inp.setAttribute("aria-label", "补记结束日期");
    const btn = el("button", "btn small ghost", "补记结束");
    btn.type = "button";
    btn.addEventListener("click", () => submitPeriodEnd(r.id, inp.value));
    form.appendChild(inp);
    form.appendChild(btn);
    main.appendChild(form);
  }
  const del = el("button", "pdel", "✕");
  del.type = "button";
  del.title = "删除这条记录";
  del.addEventListener("click", () => deletePeriod(r.id));
  row.appendChild(main);
  row.appendChild(del);
  return row;
}
function renderPeriodList() {
  const box = $("periodList");
  box.innerHTML = "";
  if (!periodRecords.length) {
    box.appendChild(el("div", "empty", "还没有记录。这里只属于你们两个人。"));
    return;
  }
  for (const r of periodRecords.slice(0, 12)) box.appendChild(periodRow(r));
}
function applyPeriodResult(d) {
  periodRecords = d.records || [];
  periodComputed = d.computed || {};
  renderPeriodHead();
  renderPeriodList();
}
async function loadPeriod() {
  if (!who) return;
  try {
    const d = await api("/api/period");
    applyPeriodResult(d);
  } catch (e) { toast(e.message); }
}
async function addPeriodToday() {

  try {

async function savePeriodForm() {
  if (!who) return;
  const start = $("periodStart").value || todayStr();
  const end = $("periodEnd").value || null;
  const note = $("periodNote").value.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(start) === false) { toast("选一个开始日期吧"); return; }
  if (end && end < start) { toast("结束日期不能早于开始日期"); return; }
  try {
    const d = await apiPost("/api/period", { action: "add", who, start, end, note });
    applyPeriodResult(d);
    $("periodEnd").value = "";
    $("periodNote").value = "";
    $("periodStart").value = todayStr();
    toast("记录已保存");
  } catch (e) { toast(e.message); }
}
async function submitPeriodEnd(id, end) {
  if (!end) { toast("先选一个结束日期吧"); return; }
  try {
    const d = await apiPost("/api/period", { action: "setEnd", id, end });
    applyPeriodResult(d);
    toast("结束日期已补上");

}
async function deletePeriod(id) {
  try {
    const d = await apiPost("/api/period", { action: "delete", id });
    applyPeriodResult(d);
    toast("记录已删除");
  } catch (e) { toast(e.message); }
}

const navToggle = $("navToggle"), navPanel = $("navPanel"), topnav = $("topnav");
function closeNav() {
  navPanel.classList.remove("open");
  navToggle.setAttribute("aria-expanded", "false");
}
navToggle.addEventListener("click", () => {
  const open = navPanel.classList.toggle("open");
  navToggle.setAttribute("aria-expanded", String(open));
});
navPanel.querySelectorAll("a").forEach((a) => a.addEventListener("click", closeNav));
document.addEventListener("click", (e) => {
  if (navPanel.classList.contains("open") && !topnav.contains(e.target)) closeNav();
});
